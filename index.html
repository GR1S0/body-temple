<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#290712">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=11" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=11">
<style>body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>BodyTemple</title>
<style>
/* Font Pangram Pangram (licenza dell'utente), incorporati: gli artifact non possono caricarli da fuori */
</style>
<style>
/* Layout: una colonna da telefono, barra schede in basso, seduta a tutto schermo con timer fisso. Stessa grammatica della scheda Full Body */
:root{
  /* Calore da sforzo, non neon: rame bruciato che scende nel rosso mattone, su neutri caldi ma non crema */
  --bg:#F4F2F1; --surface:#FFFFFF; --sunk:#EBE8E6; --fg:#171313; --muted:#68605C; --line:#E0DAD6;
  --accent:#F0561A; --accent-2:#C21E2B; --accent-ink:#FFFFFF; --accent-soft:#FDE2D6;
  --heat:linear-gradient(135deg,var(--accent) 0%,var(--accent) 40%,var(--accent-2) 135%);
  --warn:#A36A00; --warn-soft:#FAEFD4; --ok:#2E7D46; --ok-soft:#E1F1E5; --bad:#C2181F; --bad-soft:#FADDDB;
  --shadow:0 10px 40px rgba(60,20,5,.16); --glow:0 4px 18px rgba(240,86,26,.34); --neon:none; --scrim:rgba(20,8,4,.45);
  --glass:rgba(255,255,255,.72); --glass-edge:rgba(255,255,255,.7);
  /* Monument Condensed: titoli da bordo campo, corsivo in avanti · Neue Montreal: testo · Right Grotesk Mono: numeri e timer */
  --f-display:"PP Monument Condensed","Arial Narrow",Impact,system-ui,sans-serif;
  --f-body:"PP Neue Montreal",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"PP Right Grotesk Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0C0B; --surface:#191615; --sunk:#131110; --fg:#F4EFEC; --muted:#A39A95; --line:#2D2826;
  --accent:#FF6B2C; --accent-2:#EC3338; --accent-ink:#FFFFFF; --accent-soft:#3E1A10;
  --warn:#F2B33D; --warn-soft:#33260C; --ok:#6FCF8A; --ok-soft:#13291A; --bad:#FF6B5B; --bad-soft:#3A1512;
  --shadow:0 10px 40px rgba(0,0,0,.55); --glow:0 0 22px rgba(255,107,44,.42),0 0 2px rgba(255,140,80,.6); --neon:drop-shadow(0 0 14px rgba(255,98,40,.45)); --scrim:rgba(0,0,0,.62); --glass:rgba(25,22,21,.72); --glass-edge:rgba(255,255,255,.08); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0C0B; --surface:#191615; --sunk:#131110; --fg:#F4EFEC; --muted:#A39A95; --line:#2D2826;
  --accent:#FF6B2C; --accent-2:#EC3338; --accent-ink:#FFFFFF; --accent-soft:#3E1A10;
  --warn:#F2B33D; --warn-soft:#33260C; --ok:#6FCF8A; --ok-soft:#13291A; --bad:#FF6B5B; --bad-soft:#3A1512;
  --shadow:0 10px 40px rgba(0,0,0,.55); --glow:0 0 22px rgba(255,107,44,.42),0 0 2px rgba(255,140,80,.6); --neon:drop-shadow(0 0 14px rgba(255,98,40,.45)); --scrim:rgba(0,0,0,.62); --glass:rgba(25,22,21,.72); --glass-edge:rgba(255,255,255,.08); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 120px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

header.top{display:flex;flex-direction:column;gap:8px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-style:italic;font-weight:900;font-size:clamp(48px,14vw,72px);line-height:.86;letter-spacing:.005em;margin:0;text-transform:uppercase;text-wrap:balance}
h1 span{background:var(--heat);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.06em;filter:var(--neon)}
h2{font-family:var(--f-display);font-weight:900;font-size:27px;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.01em}
h3{font-family:var(--f-body);font-weight:700;font-size:18px;margin:0;line-height:1.2;letter-spacing:-.01em}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sec-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-head .note{font-size:13px;color:var(--muted);flex-basis:100%}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.list > * + *{border-top:1px solid var(--line)}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 14px;background:none;border:0;text-align:left;width:100%;cursor:pointer;min-width:0}
.lrow:hover{background:var(--sunk)}
.lrow .main{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.lrow .name{font-weight:650;font-size:15.5px;line-height:1.25}
.lrow .sub{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.chev{color:var(--muted);font-family:var(--f-mono)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--heat);border-color:transparent;color:var(--accent-ink);box-shadow:var(--glow)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.big{padding:14px 16px;font-size:16px;width:100%}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--f-mono);font-size:12.5px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tag{display:inline-block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--sunk);color:var(--muted);vertical-align:1px;white-space:nowrap}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}

.alert{border-radius:10px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:baseline}
.alert::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:currentColor;transform:translateY(-1px)}
.alert span{color:var(--fg)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.alert.info{background:var(--surface);border:1px solid var(--line);color:var(--muted)}

/* Settimana */
.week{user-select:none;-webkit-user-select:none;display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 3 * 8px) / 4);gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.week::-webkit-scrollbar{display:none}
.day{scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:118px}
.day .d{font-family:var(--f-mono);font-size:12.5px;text-transform:uppercase;color:var(--muted)}
.day .n{font-family:var(--f-display);font-style:italic;font-weight:900;font-size:44px;line-height:1}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day.future{opacity:.55}
.day .codes{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
.day .code{font-family:var(--f-mono);font-weight:700;font-size:13px;background:var(--heat);color:var(--accent-ink);border-radius:4px;padding:1px 4px}
.day .code.mob{background:var(--accent-soft);color:var(--accent)}
.balance{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-family:var(--f-mono);font-size:12.5px}
.meter{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--heat);border-radius:99px}
.meter.push i{background:var(--muted)}

/* Schede */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer;min-width:0}
.tcard:hover{border-color:var(--accent)}
.tcard .tc{font-family:var(--f-display);font-style:italic;font-weight:900;font-size:52px;line-height:.82;letter-spacing:.005em;background:var(--heat);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.08em}
.tcard .tn{font-weight:650;line-height:1.25}
.tcard .tm{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* Scheda in allenamento: stessa grammatica della Full Body */
.progress{display:flex;align-items:center;gap:12px;margin-top:4px}
.bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--heat);transition:width .3s}
.count{font-size:13px;min-width:6ch;text-align:right}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.mchip{font-family:var(--f-mono);font-size:12px;padding:4px 9px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--muted);margin:0}
.motto{display:flex;flex-direction:column;gap:4px;margin:4px 0 0;max-width:36ch}
.motto i{font-size:15px;line-height:1.4;color:var(--muted);text-wrap:pretty}
.motto .src{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.motto .src::before{content:"— "}
h1.quote{font-size:clamp(42px,12vw,64px)}
.sec-num{font-family:var(--f-mono);font-weight:700;color:var(--accent);font-size:14px}
.pair{display:flex;flex-direction:column}
.pair .ex + .ex{border-top:1px dashed var(--line)}
.pair-tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 14px 0}
.ex{display:grid;grid-template-columns:2.6em 1fr auto;gap:4px 12px;align-items:center;padding:12px 14px}
.icode{font-family:var(--f-mono);font-weight:700;font-size:13px;color:var(--accent);min-width:2.2em;flex:none}
.xcode{font-family:var(--f-mono);font-weight:700;font-size:13px;color:var(--accent);align-self:start;padding-top:3px}
.ex-main{min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.ex-name{font-weight:600;font-size:16.5px;line-height:1.22;letter-spacing:-.01em}
.ex-main:hover .ex-name{color:var(--accent)}
.ex-dose{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.info{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-family:var(--f-mono);font-weight:700;font-size:14px;display:grid;place-items:center}
.info:hover{border-color:var(--accent);color:var(--accent)}
.sets{grid-column:2 / 4;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;align-items:center}
.dot{min-width:34px;height:34px;padding:0 4px;border-radius:8px;border:1.5px solid var(--line);background:transparent;cursor:pointer;font-family:var(--f-mono);font-size:12px;color:var(--muted);display:grid;place-items:center;transition:background .15s,border-color .15s}
.dot[aria-pressed="true"]{background:var(--heat);border-color:transparent;color:var(--accent-ink);font-weight:700;box-shadow:var(--glow)}
.vals{font-family:var(--f-mono);font-size:12px;color:var(--muted);background:none;border:1px dashed var(--line);border-radius:8px;height:34px;padding:0 9px;cursor:pointer;white-space:nowrap}
.vals:hover{color:var(--accent);border-color:var(--accent)}
.flag{display:inline-block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--warn-soft);color:var(--warn);margin-left:6px;vertical-align:2px}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.rules b{font-weight:700}
.reset{background:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:13px;color:var(--muted)}
.reset:hover{color:var(--fg);border-color:var(--fg)}
.sh-top{display:flex;gap:12px;align-items:flex-start}
.sh-top h3{font-family:var(--f-display);font-style:italic;font-weight:900;font-size:32px;line-height:.95;margin:0;text-transform:uppercase;letter-spacing:.005em}
.sh-dose{font-family:var(--f-mono);font-size:13px;color:var(--muted);margin-top:4px}
.close{margin-left:auto;flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:18px;line-height:1}
.sh-nav{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.sh-nav button{background:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:13px}
.sh-nav button:disabled{opacity:.35;cursor:default}
.sh-vals{background:var(--sunk);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.last{font-size:13px;display:flex;flex-direction:column;gap:4px}
.last .l1{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.last .l2 b{color:var(--accent)}
.logged{display:flex;flex-direction:column;gap:4px}
.lset{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:13px;padding:6px 8px;border-radius:8px;background:var(--accent-soft)}
.lset .k{font-weight:700;color:var(--accent);min-width:1.6em}
.lset .x{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:2px 6px}
.field{display:grid;grid-template-columns:4.2em 1fr;gap:8px;align-items:center}
.field .lab{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.step button{width:44px;height:42px;border:0;background:none;cursor:pointer;font-size:20px;font-weight:600}
.step button:active{background:var(--sunk)}
.step output{min-width:3.4em;text-align:center;font-family:var(--f-mono);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.loadrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.notebox{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;line-height:1.45;resize:vertical;min-height:3.2em}
.dict,.fld > span.dict{font-size:12px;color:var(--muted);margin:0;text-transform:none;letter-spacing:0;font-family:var(--f-body)}
.unote{font-size:13px;color:var(--accent);font-style:italic;line-height:1.35}
.confirm{background:var(--warn-soft);color:var(--fg);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}

/* Timer e schede in basso */
.timer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);border-top:1px solid var(--glass-edge);
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-top:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.timer-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
.t-label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-family:var(--f-mono)}
.t-time{font-family:var(--f-mono);font-weight:760;font-size:27px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;min-width:4.2ch;line-height:1.1}
.t-ring{width:46px;height:46px;flex:none;transform:rotate(-90deg)}
.t-ring circle{fill:none;stroke-width:4}
.t-ring .trk{stroke:var(--line)}
.t-ring .val{filter:var(--neon);stroke:url(#heat);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.timer.done .t-ring .val{stroke:var(--warn)}
.timer.done .t-time{animation:breathe 1.2s ease-in-out 2}
@keyframes breathe{50%{transform:scale(1.06)}}
.timer.running .t-time{color:var(--accent)}
.timer.done .t-time{color:var(--warn)}
.t-btns{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.t-btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;cursor:pointer;font-family:var(--f-mono);font-size:13px}
.t-btn.primary{background:var(--heat);color:var(--accent-ink);border-color:transparent}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);border-top:1px solid var(--glass-edge);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;cursor:pointer;padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11.5px;font-weight:600}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}

/* Form */
.form{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld > span{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select,.fld textarea,.search{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.fld textarea{min-height:90px;resize:vertical;line-height:1.45}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:420px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.titem{display:flex;flex-direction:column;gap:8px;padding:12px 14px}
.titem .top{display:flex;gap:8px;align-items:center}
.titem .top .name{font-weight:650;flex:1;min-width:0}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-family:var(--f-mono);font-size:14px;flex:none}
.titem .grid4 input{padding:8px;text-align:center}
.titem .grid4 label{display:flex;flex-direction:column;gap:2px;font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}

/* Esercizio */
.notes{display:flex;flex-direction:column;gap:10px;margin:0}
.note{display:grid;grid-template-columns:7.5em 1fr;gap:10px;align-items:baseline}
.note dt{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:700}
.note dd{margin:0;min-width:0}
.note.err dt{color:var(--warn)}
.note.err dd{background:var(--warn-soft);padding:6px 10px;border-radius:8px}
@media (max-width:420px){.note{grid-template-columns:1fr;gap:2px}}
.spark{width:100%;height:64px;display:block}
.spark .ln{fill:none;stroke:var(--accent);stroke-width:2}
.spark .ar{fill:var(--accent-soft)}
.spark .dt{fill:var(--accent)}
.spark .gr{stroke:var(--line);stroke-width:1}
.spark text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}

/* Overlay e toast */
.overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.overlay::before{content:"";position:absolute;inset:0;background:var(--scrim);opacity:var(--dim,1)}
.overlay > .sheet{position:relative}
.sheet{background:var(--surface);color:var(--fg);width:100%;max-width:560px;max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;box-shadow:var(--shadow);
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:12px;touch-action:pan-y;will-change:transform}
.grab{align-self:center;width:40px;height:5px;border-radius:99px;background:var(--line);margin:-8px 0 -2px;flex:none}
.sh-drag{touch-action:none;cursor:grab;display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:16px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg);
  border-radius:10px;padding:10px 14px;font-size:14px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast button{background:none;border:0;color:var(--accent-soft);font-weight:700;cursor:pointer;padding:0}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:6px}
.empty b{color:var(--fg)}
.thinking{font-family:var(--f-mono);font-size:13px;color:var(--accent)}
/* Risposta: il feedback vive sulla pressione, ed è immediato */
button,.chip,.dot{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn,.chip,.dot,.t-btn,.vals,.info,.reset,.tcard,.lrow,.step button,.ex-main{transition:transform .1s ease-out,background .15s,border-color .15s}
.btn:active,.chip:active,.dot:active,.t-btn:active,.vals:active,.info:active,.reset:active,.tcard:active{transform:scale(.94)}
.lrow:active,.ex-main:active{transform:scale(.985)}
.dot.pop{animation:pop .42s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.72)}100%{transform:scale(1)}}
.ex.flash{animation:flash .9s ease-out}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
.bar i{transition:width .45s cubic-bezier(.22,1,.36,1)}
@media (prefers-reduced-motion:reduce){
  .dot.pop,.ex.flash,.timer.done .t-time{animation:none}
  .bar i,.t-ring .val{transition:none}
  .btn:active,.chip:active,.dot:active,.t-btn:active,.vals:active,.info:active,.reset:active,.tcard:active,.lrow:active,.ex-main:active{transform:none}
}
@media (prefers-reduced-transparency:reduce){.timer,.tabs{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none;border-top-color:var(--line)}}
@media (prefers-contrast:more){:root{--line:var(--muted)}.timer,.tabs{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}}
/* Squircle: curvatura continua come le icone Apple. Raggi più ampi perché la superellisse "mangia" meno angolo */
@supports (corner-shape: squircle) {
  .card,.list,.tcard,.tiles,.confirm,.empty,.sh-vals,.item{corner-shape:squircle;border-radius:24px}
  .btn,.step,.notebox,.fld input,.fld select,.fld textarea,.search,.alert,.toast,.day{corner-shape:squircle;border-radius:20px}
  .btn.sm,.dot,.vals,.reset,.t-btn,.icon-btn,.lset,.last{corner-shape:squircle;border-radius:15px}
  .info,.close{corner-shape:squircle;border-radius:17px}
  .chip,.mchip{corner-shape:squircle}
  .tag,.flag{corner-shape:squircle;border-radius:8px}
  .sheet{corner-shape:squircle;border-radius:32px 32px 0 0}
  @media (min-width:700px){.sheet{border-radius:32px}}
}
/* Anteprima dell'icona */
.appicon{width:76px;height:76px;border-radius:18px;overflow:hidden;flex:none;box-shadow:var(--shadow)}
.appicon{object-fit:cover}
@supports (corner-shape: squircle){.appicon{corner-shape:squircle;border-radius:24px}}
/* Bilancio di fine seduta */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tile{background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .l{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--f-display);font-style:italic;font-weight:900;font-size:44px;line-height:.9;letter-spacing:.005em;font-variant-numeric:tabular-nums}
@media (max-width:420px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.delta{font-family:var(--f-mono);font-size:12.5px;font-weight:700;white-space:nowrap}
.delta.up{color:var(--ok)} .delta.down{color:var(--warn)} .delta.eq,.delta.new{color:var(--muted)}
</style>

<body>
<div class="wrap" id="app" aria-live="polite"></div>

<div class="timer" id="timer" hidden></div>

<nav class="tabs" id="tabs" aria-label="Sezioni">
  <div class="tabs-in">
    <button class="tab" type="button" data-tab="oggi"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Oggi</button>
    <button class="tab" type="button" data-tab="schede"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>Schede</button>
    <button class="tab" type="button" data-tab="esercizi"><svg viewBox="0 0 24 24"><path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/></svg>Esercizi</button>
    <button class="tab" type="button" data-tab="storico"><svg viewBox="0 0 24 24"><path d="M4 19h16M7 16V10M12 16V6M17 16v-4"/></svg>Storico</button>
    <button class="tab" type="button" data-tab="profilo"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.5"/><path d="M5 20c1.5-3.5 4-5 7-5s5.5 1.5 7 5"/></svg>Profilo</button>
  </div>

<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
// BodyTemple fuori da claude.ai: sostituisce window.claude con un database su un repository GitHub privato.
// Stessa forma dell'API usata dall'app (collection/doc, onSnapshot, set, delete), con copia locale in IndexedDB
// così l'app si apre subito e funziona anche offline; le modifiche partono verso GitHub appena c'è rete.
(() => {
  const CFG_KEY = 'bt-gh';
  const cfg = (() => { try { return JSON.parse(localStorage.getItem(CFG_KEY)) || null; } catch (e) { return null; } })();
  const API = (cfg && cfg.api) || 'https://api.github.com'; // cfg.api serve solo per le prove in locale

  /* ---------- IndexedDB minimo ---------- */
  let dbp = null;
  const idbOpen = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('bodytemple', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const idb = (mode, fn) => idbOpen().then(db => new Promise((res, rej) => {
    const t = db.transaction('kv', mode); const req = fn(t.objectStore('kv'));
    t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error);
  }));
  const idbGet = k => idb('readonly', s => s.get(k)).catch(() => undefined);
  const idbSet = (k, v) => idb('readwrite', s => s.put(v, k)).catch(() => {});

  /* ---------- GitHub contents API ---------- */
  const b64enc = str => { const b = new TextEncoder().encode(str); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
  const b64dec = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, '')), c => c.charCodeAt(0)));
  const fail = (code, status) => Object.assign(new Error(code), {code, status});
  async function gh(path, opt = {}) {
    let r;
    try {
      r = await fetch(`${API}/repos/${cfg.repo}/${path}`, Object.assign({cache: 'no-store'}, opt, {headers: Object.assign({
        Authorization: `Bearer ${cfg.token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}, opt.headers || {})}));
    } catch (e) { throw fail('offline'); }
    if (r.status === 401 || r.status === 403) throw fail('auth', r.status);
    return r;
  }
  async function listDir(dir) {
    const r = await gh('contents/' + dir);
    if (r.status === 404) return [];
    if (!r.ok) throw fail('net', r.status);
    const j = await r.json(); return Array.isArray(j) ? j : [];
  }
  async function getFile(path) {
    const r = await gh('contents/' + path);
    if (r.status === 404) return {sha: null, data: null};
    if (!r.ok) throw fail('net', r.status);
    const j = await r.json();
    let content = j.content;
    if (!content && j.sha) { // oltre 1 MB l'API contents non include il testo: lo prendo dal blob
      const b = await gh('git/blobs/' + j.sha); if (!b.ok) throw fail('net', b.status); content = (await b.json()).content;
    }
    return {sha: j.sha, data: content ? JSON.parse(b64dec(content)) : null};
  }
  async function putFile(path, data, sha) {
    const body = {message: `bodytemple: ${path}`, content: b64enc(JSON.stringify(data))};
    if (sha) body.sha = sha;
    const r = await gh('contents/' + path, {method: 'PUT', body: JSON.stringify(body), headers: {'Content-Type': 'application/json'}});
    if (r.status === 409 || r.status === 422) throw fail('conflict', r.status);
    if (!r.ok) throw fail('net', r.status);
    return (await r.json()).content.sha;
  }

  /* ---------- copia locale, file per collezione ---------- */
  // sessions è divisa per mese (l'id comincia con la data) così nessun file cresce troppo
  const shardOf = (col, id) => col === 'sessions' ? `data/sessions/${id.slice(0, 7)}.json` : `data/${col}.json`;
  const colOf = path => path.startsWith('data/sessions/') ? 'sessions' : path.slice(5, -5);
  let cache = {shards: {}, dirty: [], pulled: false};
  const shard = p => cache.shards[p] || (cache.shards[p] = {sha: null, docs: {}, meta: {}});
  const persist = () => idbSet('cache', cache);
  // ogni documento porta l'ora dell'ultima modifica: vince la più recente, anche per le cancellazioni
  function merge(remote, local) {
    const r = remote || {docs: {}, meta: {}}, out = {docs: {}, meta: {}};
    const ids = new Set([...Object.keys(r.meta || {}), ...Object.keys(local.meta || {})]);
    for (const id of ids) {
      const rm = (r.meta || {})[id] || {m: 0}, lm = (local.meta || {})[id] || {m: 0};
      const src = lm.m >= rm.m ? local : r, m = lm.m >= rm.m ? lm : rm;
      out.meta[id] = m;
      if (!m.d && src.docs && src.docs[id] !== undefined) out.docs[id] = src.docs[id];
    }
    return out;
  }

  /* ---------- ascoltatori, come onSnapshot ---------- */
  const listeners = [];
  const docsOf = col => {
    const all = [];
    for (const [p, s] of Object.entries(cache.shards)) if (colOf(p) === col) for (const [id, d] of Object.entries(s.docs)) all.push([id, d]);
    return all;
  };
  function emit(col) {
    for (const l of listeners) {
      if (l.col !== col) continue;
      if (l.id) {
        const hit = docsOf(col).find(([id]) => id === l.id);
        l.ok({exists: !!hit, id: l.id, data: () => hit && JSON.parse(JSON.stringify(hit[1])), metadata: {fromCache: !cache.pulled}});
      } else {
        let list = docsOf(col);
        if (l.order) { const [f, dir] = l.order; list.sort((a, b) => ((a[1][f] || 0) - (b[1][f] || 0)) * (dir === 'desc' ? -1 : 1)); }
        if (l.limit) list = list.slice(0, l.limit);
        l.ok({docs: list.map(([id, d]) => ({id, data: () => JSON.parse(JSON.stringify(d))})), metadata: {fromCache: !cache.pulled}});
      }
    }
  }
  const emitAll = () => ['exercises', 'templates', 'phases', 'settings', 'sessions'].forEach(emit);
  const failAll = e => listeners.forEach(l => l.err && l.err(e));

  /* ---------- sincronizzazione ---------- */
  let pulling = null, pushT = null, pushing = null;
  async function pull() {
    if (pulling) return pulling;
    pulling = (async () => {
      const files = [...await listDir('data'), ...await listDir('data/sessions')].filter(f => f.type === 'file' && f.name.endsWith('.json'));
      const changed = new Set();
      for (const f of files) {
        const s = shard(f.path);
        if (s.sha === f.sha) continue;
        const remote = await getFile(f.path);
        const merged = merge(remote.data, cache.dirty.includes(f.path) ? s : {docs: {}, meta: {}});
        cache.shards[f.path] = Object.assign(merged, {sha: remote.sha});
        changed.add(colOf(f.path));
      }
      const first = !cache.pulled; cache.pulled = true;
      await persist();
      if (first) emitAll(); else changed.forEach(emit);
      if (cache.dirty.length) schedulePush(0);
    })().finally(() => { pulling = null; });
    return pulling;
  }
  function schedulePush(ms = 1200) { clearTimeout(pushT); pushT = setTimeout(push, ms); }
  async function push() {
    if (pushing) return pushing.then(() => schedulePush(0));
    pushing = (async () => {
      for (const path of [...cache.dirty]) {
        for (let tries = 0; tries < 4; tries++) {
          try {
            const remote = await getFile(path);
            const merged = merge(remote.data, shard(path));
            const sha = await putFile(path, {docs: merged.docs, meta: merged.meta}, remote.sha);
            cache.shards[path] = Object.assign(merged, {sha});
            cache.dirty = cache.dirty.filter(p => p !== path);
            await persist(); emit(colOf(path));
            break;
          } catch (e) {
            if (e.code === 'conflict') continue;
            if (e.code === 'auth') { failAll(e); return; }
            schedulePush(15000); return; // offline o errore temporaneo: riprovo dopo
          }
        }
      }
    })().finally(() => { pushing = null; });
    return pushing;
  }
  async function write(path, data) {
    const [col, id] = path.split('/');
    const p = shardOf(col, id), s = shard(p);
    if (data === null) { delete s.docs[id]; s.meta[id] = {m: Date.now(), d: 1}; }
    else { s.docs[id] = JSON.parse(JSON.stringify(data)); s.meta[id] = {m: Date.now()}; }
    if (!cache.dirty.includes(p)) cache.dirty.push(p);
    await persist(); emit(col); schedulePush();
  }

  /* ---------- API come quella di claude.ai ---------- */
  const query = (col, extra = {}) => ({
    orderBy: (f, dir = 'asc') => query(col, Object.assign({}, extra, {order: [f, dir]})),
    limit: n => query(col, Object.assign({}, extra, {limit: n})),
    onSnapshot(ok, err) { const l = Object.assign({col, ok, err}, extra); listeners.push(l); if (cache.pulled) setTimeout(() => emit(col), 0); return () => listeners.splice(listeners.indexOf(l), 1); },
  });
  const doc = path => {
    const [col, id] = path.split('/');
    return {
      set: data => write(path, data), delete: () => write(path, null),
      onSnapshot(ok, err) { const l = {col, id, ok, err}; listeners.push(l); if (cache.pulled) setTimeout(() => emit(col), 0); return () => listeners.splice(listeners.indexOf(l), 1); },
    };
  };
  const db = {collection: col => query(col), doc};

  async function startDb() {
    const saved = await idbGet('cache');
    if (saved && saved.shards) cache = Object.assign({shards: {}, dirty: [], pulled: false}, saved);
    const hadCache = cache.pulled;
    if (hadCache) cache.pulled = false; // la copia locale si mostra subito ma resta "da cache" finché GitHub non risponde
    if (hadCache) setTimeout(emitAll, 0);
    pull().catch(e => { if (e.code === 'auth' || !hadCache) failAll(e); });
    const again = () => { if (document.visibilityState === 'visible') pull().catch(() => {}); };
    document.addEventListener('visibilitychange', again);
    addEventListener('online', () => { again(); schedulePush(0); });
    setInterval(again, 45000);
    return db;
  }

  /* ---------- font: stanno nel repository privato, non nella pagina pubblica ---------- */
  async function loadFonts() {
    let faces = await idbGet('fonts');
    if (!faces) {
      const r = await gh('contents/fonts/fonts.json'); if (!r.ok) return;
      const list = JSON.parse(b64dec((await r.json()).content));
      faces = [];
      for (const f of list) {
        const b = await gh('contents/fonts/' + f.file, {headers: {Accept: 'application/vnd.github.raw'}});
        if (b.ok) faces.push(Object.assign({}, f, {buf: await b.arrayBuffer()}));
      }
      idbSet('fonts', faces);
    }
    for (const f of faces) { const ff = new FontFace(f.family, f.buf, {weight: f.weight, style: f.style, display: 'swap'}); await ff.load(); document.fonts.add(ff); }
  }

  /* ---------- Claude: la richiesta va nel repository, un GitHub Action la passa a Claude Code ---------- */
  // Stessa forma di sample.json di claude.ai: prompt in entrata, JSON della risposta in uscita.
  const sleep = (ms, signal) => new Promise((res, rej) => {
    const t = setTimeout(res, ms);
    if (signal) signal.addEventListener('abort', () => { clearTimeout(t); rej(fail('cancelled')); }, {once: true});
  });
  const sample = {json: async (prompt, {signal} = {}) => {
    const id = `${new Date().toISOString().slice(0, 10)}-${Math.random().toString(36).slice(2, 8)}`;
    await putFile(`requests/${id}.json`, {prompt, createdAt: Date.now()});
    const until = Date.now() + 6 * 60000;
    while (Date.now() < until) {
      await sleep(6000, signal);
      const r = await gh(`contents/results/${id}.json`);
      if (r.status === 404) continue;
      if (!r.ok) throw fail('net', r.status);
      const j = await r.json();
      gh(`contents/results/${id}.json`, {method: 'DELETE', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message: `bodytemple: letto ${id}`, sha: j.sha})}).catch(() => {});
      const res = JSON.parse(b64dec(j.content));
      if (!res.ok) throw fail(res.error || 'claude');
      return res.data;
    }
    throw fail('timeout');
  }};

  /* ---------- download del backup ---------- */
  const downloads = {save: async ({filename, data}) => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], {type: 'application/json'})); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }};

  /* ---------- collegamento a GitHub ---------- */
  window.BT_SETUP = err => {
    const msg = !cfg ? 'Per sincronizzare telefono e Mac, collega il repository privato dove stanno i tuoi dati.'
      : err === 'auth' ? 'GitHub non accetta questa chiave: forse è scaduta o non ha accesso al repository.'
      : 'GitHub non risponde: controlla la connessione e riprova.';
    return `<header class="top"><h1>Collega <span>i dati</span></h1></header>
      <div class="card" style="display:flex;flex-direction:column;gap:12px">
        <p class="muted">${msg}</p>
        <label class="small">Repository<br><input id="gh-repo" type="text" autocomplete="off" spellcheck="false" value="${(cfg && cfg.repo) || 'GR1S0/body-temple-data'}" style="width:100%"></label>
        <label class="small">Chiave GitHub (token)<br><input id="gh-token" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…" style="width:100%"></label>
        <button class="btn primary" type="button" id="gh-save">Collega</button>
        <p class="small muted">La chiave resta solo su questo dispositivo.</p>
      </div>`;
  };
  document.addEventListener('click', e => {
    if (!e.target.closest('#gh-save')) return;
    const repo = document.getElementById('gh-repo').value.trim(), token = document.getElementById('gh-token').value.trim();
    if (!repo || !token) return;
    localStorage.setItem(CFG_KEY, JSON.stringify({repo, token}));
    location.reload();
  });

  window.claude = {use: async k => {
    if (k === 'db') return cfg ? startDb() : null;
    if (k === 'downloads') return downloads;
    if (k === 'sample') return cfg ? sample : null;
    return null;
  }};
  if (cfg) loadFonts().catch(() => {});
})();
</script>
<script>
/* ---------- utilità ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const isoDay = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDay = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, (m||1)-1, d||1); };
const DOW = ['dom','lun','mar','mer','gio','ven','sab'];
const MON = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const fmtDay = s => { const d = parseDay(s); return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
const daysBetween = (a, b) => Math.round((parseDay(b) - parseDay(a)) / 864e5);
const addDays = (s, n) => { const d = parseDay(s); d.setDate(d.getDate()+n); return isoDay(d); };
const uid = () => Math.random().toString(36).slice(2, 8);
const slug = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40) || 'esercizio';
const clone = o => JSON.parse(JSON.stringify(o));
const hhmm = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

const CATS = {tirata:'Tirata', spinta:'Spinta', scapole:'Scapole', lower:'Lower', core:'Core', mobilita:'Mobilità', caviglia:'Caviglie', fisio:'Fisio'};
const STATUS = {attivo:'Attivo', provare:'Da provare', bloccato:'Bloccato', archiviato:'Archiviato'};
const FOOT = {ok:'Piede ok', cautela:'Cautela piede', vietato:'Vietato piede', prescritto:'Prescritto fisio'};
const KINDS = {ipertrofia:'Forza / ipertrofia', controllo:'Controllo', tendine:'Tendine', mobilita:'Mobilità'};
const LOADS = {corpo:'Corpo libero', banda:'Banda', kg:'Peso (kg)'};
const EQUIP = {banda:'Bande', manubri:'Manubri', zaino:'Zaino', miniband:'Miniband'};
const FOCUS = {
  tirata:  {label:'Tirata',            slots:['tirata','tirata','tirata','scapole','core']},
  spinta:  {label:'Spinta e scapole',  slots:['spinta','scapole','spinta','scapole','tirata']},
  lower:   {label:'Lower e core',      slots:['lower','lower','core','lower','core','core']},
  full:    {label:'Full body',         slots:['spinta','tirata','lower','tirata','spinta','core','tirata']},
  mobilita:{label:'Mobilità',          slots:['mobilita','mobilita','mobilita','mobilita','mobilita','mobilita','caviglia','caviglia']}
};
const UPPER = ['tirata','spinta','scapole'];
const TABOF = {oggi:'oggi', genera:'oggi', sessione:'oggi', schede:'schede', scheda:'schede', esercizi:'esercizi', esercizio:'esercizi', storico:'storico', seduta:'storico', profilo:'profilo'};

const unitMark = u => u === 'sec' ? '″' : '';
const range = o => (o.min === o.max ? `${o.min}` : `${o.min}–${o.max}`) + unitMark(o.unit);
const doseStr = o => `${o.sets} × ${range(o)}${o.perSide ? ' /lato' : ''}`;
const fmtLoad = l => !l ? 'corpo' : /kg$/.test(l) ? l : `banda ${l}`;
const fmtSet = (s, unit) => `${s.reps}${unitMark(unit)}`;
function fmtLog(log, unit) {
  if (!log || !log.length) return '';
  const loads = [...new Set(log.map(s => s.load || ''))];
  const rirs = log.map(s => s.rir).filter(r => r != null);
  return `${log.map(s => fmtSet(s, unit)).join(' · ')} — ${loads.map(fmtLoad).join(', ')}${rirs.length ? ` · RIR ${rirs.join('/')}` : ''}`;
}

/* ---------- dati derivati ---------- */
const bands = () => (S.settings.bands && S.settings.bands.length ? S.settings.bands : ['leggera','media','forte']);
const tplList = () => Object.values(S.tpl).sort((a,b) => (a.order ?? 99) - (b.order ?? 99) || String(a.name).localeCompare(b.name));
const phaseNum = () => Number(S.settings.phase || 1);
const curPhase = () => S.phases[String(phaseNum())];
const finished = () => S.sessions.filter(s => s.status === 'finita');
function setsIn(s, cats) { let n = 0; for (const it of s.items || []) if (!it.warmup && cats.includes(it.cat)) n += (it.log || []).length; return n; }
const isUpper = s => setsIn(s, UPPER) >= 4;
function lastPerf(exId, exclude) {
  if (!exId) return null;
  for (const s of S.sessions) {
    if (s.id === exclude) continue;
    const it = (s.items || []).find(i => i.ex === exId && !i.warmup && i.log && i.log.length);
    if (it) return {date: s.date, log: it.log, unit: it.unit};
  }
  return null;
}
function lastDone(exId) { for (const s of S.sessions) if ((s.items || []).some(i => i.ex === exId && (i.log || []).length)) return s.startedAt || 0; return 0; }
function lastTpl(code) { const s = finished().find(x => x.code === code); return s ? s.date : null; }
function history(exId) {
  const out = [];
  for (const s of S.sessions) for (const it of s.items || []) if (it.ex === exId && !it.warmup && (it.log || []).length) out.push({date: s.date, sid: s.id, log: it.log, unit: it.unit});
  return out;
}
function weekDays(ref = isoDay()) { const d = parseDay(ref); const off = (d.getDay() + 6) % 7; const mon = addDays(ref, -off); return [0,1,2,3,4,5,6].map(i => addDays(mon, i)); }
const sessCode = s => s.code || (s.source === 'fisio' ? 'F' : s.source === 'claude' || s.source === 'regole' ? 'G' : '•');

function fromEx(e, over = {}) {
  return Object.assign({
    ex: e.id, name: e.name, cat: e.cat, kind: e.kind || 'ipertrofia', unit: e.unit || 'reps', perSide: !!e.perSide,
    sets: e.sets || 3, min: e.min ?? 8, max: e.max ?? 12, rest: e.rest ?? 60, pair: null, note: '', warmup: false, log: [],
    block: null, code: null, flag: e.flag || null
  }, over);
}
function fromTplItem(ti) {
  const e = S.ex[ti.ex];
  const base = e ? fromEx(e) : {ex: ti.ex || null, name: ti.name || ti.ex, cat: ti.cat || 'core', kind: ti.kind || 'ipertrofia', unit: ti.unit || 'reps', perSide: !!ti.perSide, log: []};
  const o = Object.assign(base, {sets: ti.sets ?? base.sets, min: ti.min ?? base.min, max: ti.max ?? base.max, rest: ti.rest ?? base.rest, pair: ti.pair || null, note: ti.note || '', warmup: !!ti.warmup, log: [],
    block: ti.block || null, code: ti.code || null, flag: ti.flag || (e && e.flag) || null});
  if (ti.unit) o.unit = ti.unit;
  if (ti.perSide != null) o.perSide = !!ti.perSide;
  return o;
}
function phaseItems() { const ph = curPhase(); return ph ? (ph.items || []).map(fromTplItem) : []; }

function nextLoad(l) {
  if (!l) return null;
  if (/kg$/.test(l)) return (parseFloat(l) + 1) + ' kg';
  const b = bands(), i = b.indexOf(l);
  return i >= 0 && i < b.length - 1 ? b[i+1] : null;
}
function suggest(it, e, last) {
  const kind = it.kind || e.kind || 'ipertrofia', top = it.max, bot = it.min, u = unitMark(it.unit);
  if (it.warmup) return {text:'', reps: top};
  if (!last) return {
    text: kind === 'tendine' ? 'Dose della fase, dolore entro 3/10' : kind === 'mobilita' ? 'Lento e controllato, senza forzare il range' : `Parti da ${bot}${u} e trova il carico giusto`,
    reps: kind === 'mobilita' || kind === 'tendine' ? top : bot
  };
  const L = last.log, reps = L.map(s => s.reps), lo = Math.min(...reps), load = L[L.length-1].load || '';
  const rirs = L.map(s => s.rir).filter(r => r != null);
  const allTop = L.length >= it.sets && reps.every(r => r >= top);
  if (kind === 'mobilita') return {text:'Come l\'ultima volta, senza forzare il range', reps: Math.max(...reps), load};
  if (kind === 'tendine') return {text:'Stessa dose. Progredisci solo se il dolore resta 0–3/10 e rientra entro 24 h', reps: Math.max(...reps), load};
  if (kind === 'controllo') {
    if (rirs.some(r => r < 2)) return {text:'Eri vicino al cedimento: stessa dose, più controllo', reps: lo, load};
    if (allTop) return {text: e.progression || 'Range pieno: rallenta il tempo o aggiungi una pausa, non il carico', reps: top, load};
    return {text:'+1 rep per serie, tecnica pulita', reps: Math.min(top, lo + 1), load};
  }
  if (allTop && (!rirs.length || Math.min(...rirs) >= 1)) {
    const nl = nextLoad(load);
    if (nl) return {text:`Range pieno: passa a ${fmtLoad(nl)} e riparti da ${bot}${u}`, reps: bot, load: nl};
    return {text: e.progression || 'Range pieno: passa a una variante più dura e riparti dal basso', reps: top, load};
  }
  if (rirs.length && rirs.every(r => r === 0)) return {text:'Hai chiuso a cedimento: ripeti la stessa dose', reps: lo, load};
  return {text:`+1 rep per serie a parità di RIR, obiettivo ${top}${u} su tutte`, reps: Math.min(top, lo + 1), load};
}

/* ---------- rendering ---------- */
let pending = false;
function render() {
  const a = document.activeElement;
  if (a && a.closest && a.closest('#app, #sheet') && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.type !== 'checkbox') { pending = true; return; }
  draw();
}
document.addEventListener('focusout', () => { if (pending) setTimeout(() => { const a = document.activeElement; if (pending && !(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) draw(); }, 0); });

let weekX = null;
function draw() {
  pending = false;
  let html;
  if (S.status === 'nodb') html = viewNoDb();
  else if (S.status === 'loading') html = viewLoading();
  else html = (VIEWS[S.view] || VIEWS.oggi)();
  $('#app').innerHTML = html;
  const wk = $('#app .week');
  if (wk) {
    const y = wk.querySelector('.day.yest');
    wk.scrollLeft = weekX ?? (y ? y.offsetLeft - wk.firstElementChild.offsetLeft : 0);
    wk.addEventListener('scroll', () => { weekX = wk.scrollLeft; }, {passive: true});
  }
  $('#tabs').hidden = inWorkout();
  document.querySelectorAll('#tabs [data-tab]').forEach(b => b.setAttribute('aria-current', TABOF[S.view] === b.dataset.tab ? 'page' : 'false'));
  drawTimer();
  if (S.picker) drawPickerList();
  if (S.sheet) drawSheet();
}
const inWorkout = () => S.status === 'ok' && (S.view === 'sessione' || (S.view === 'scheda' && !S.tplDraft && !!S.tpl[S.param]));
function go(view, param = null) {
  if (S.view === 'sessione' && view !== 'sessione') flush();
  if (S.sheet) closeSheet();
  S.view = view; S.param = param; S.confirm = null; S.exEdit = false; weekX = null;
  if (TABOF[view] === view) lsSet('rc-view', view);
  draw(); window.scrollTo(0, 0);
  if (inWorkout()) wakeOn(); else wakeOff();
}

let toastT = null;
function toast(msg, undo) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button" id="undo">Annulla</button>' : ''}`;
  t.hidden = false;
  if (undo) $('#undo').onclick = () => { t.hidden = true; undo(); };
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, undo ? 6000 : 3500);
}

const QUOTES = [
  ['Sopporta, cuore:', 'hai sopportato di peggio', 'Omero, Odissea XX'],
  ['Ciò che ostacola', 'diventa la via', 'Marco Aurelio, Meditazioni V'],

const quoteOf = day => QUOTES[Math.abs(daysBetween('2026-01-01', day)) % QUOTES.length];

function viewOggi() {
  const today = isoDay(), days = weekDays(today);
  const weekSess = finished().filter(s => days.includes(s.date));
  const pull = weekSess.reduce((n, s) => n + setsIn(s, ['tirata']), 0);
  const push = weekSess.reduce((n, s) => n + setsIn(s, ['spinta']), 0);
  const maxV = Math.max(pull, push, 1);
  const alerts = [];
  const yest = addDays(today, -1);
  const doneToday = finished().filter(s => s.date === today);
  if (finished().some(s => s.date === yest && isUpper(s)) && !doneToday.length)
    alerts.push(['warn', 'Ieri hai allenato la parte alta.', 'Oggi meglio B, mobilità o nuoto: mai A e C in giorni consecutivi.']);
  const lastS = finished()[0];
  if (lastS) {
    const gap = daysBetween(lastS.date, today);
    if (gap >= 2) alerts.push(['info', `Ultima seduta ${gap} giorni fa.`, 'Mai saltare due volte di fila: anche la mobilità breve vale.']);
  }
  if (weekSess.length && push > pull) alerts.push(['warn', `Questa settimana la spinta (${push} serie) supera la tirata (${pull}).`, 'La prossima seduta parti dalla tirata.']);

  const strip = Array.from({length: 43}, (_, i) => addDays(today, i - 21));
  const weekHtml = strip.map(d => {
    const ss = S.sessions.filter(s => s.date === d);
    const dd = parseDay(d);
    return `<div class="day${d === today ? ' today' : ''}${d > today ? ' future' : ''}${d === yest ? ' yest' : ''}"><span class="d">${DOW[dd.getDay()]}</span><span class="n">${dd.getDate()}</span>
      <span class="codes">${ss.map(s => `<span class="code${['MB','ML'].includes(s.code) ? ' mob' : ''}" title="${esc(s.title)}">${esc(sessCode(s))}</span>`).join('')}</span></div>`;
  }).join('');

  const act = S.active;
  const actHtml = act ? `<div class="card" style="border-color:var(--accent)">
      <div class="row"><span class="tag acc">In corso</span><span class="mono small muted">dalle ${hhmm(act.startedAt)}</span></div>
      <h3>${esc(act.title)}</h3>
      <p class="small muted">${act.items.reduce((n,i) => n + i.log.length, 0)} serie registrate su ${act.items.reduce((n,i) => n + i.sets, 0)}</p>
      <button class="btn primary big" type="button" data-a="resume">Riprendi la seduta</button></div>` : '';

  const tpls = tplList();
  const tplHtml = tpls.length ? `<div class="tgrid">${tpls.map(t => {
    const ld = lastTpl(t.code);
    return `<button class="tcard" type="button" data-a="open-tpl" data-id="${esc(t.id)}"><span class="tc">${esc(t.code)}</span><span class="tn">${esc(t.name)}</span>
      <span class="tm">~${esc(t.minutes)}′ · ${ld ? (daysBetween(ld, today) === 0 ? 'fatta oggi' : `${daysBetween(ld, today)} gg fa`) : 'mai fatta'}</span></button>`;
  }).join('')}</div>` : `<div class="empty"><b>Nessuna scheda ancora.</b>Creane una dalla sezione Schede o genera una seduta al volo.</div>`;

  const ph = curPhase();
  const phHtml = ph ? `<section class="stack">
      <div class="sec-head"><h2>Fisio · fase ${phaseNum()}</h2><p class="note">${esc(ph.name)} · dal ${S.settings.phaseSince ? fmtDay(S.settings.phaseSince) : '—'} · ${esc(ph.freq || '')}</p></div>
      <div class="list">${(ph.items || []).map(ti => { const o = fromTplItem(ti); return `<div class="lrow" style="cursor:default"><div class="main"><span class="name">${esc(o.name)}</span><span class="sub">${esc(doseStr(o))}${ti.freq ? ' · ' + esc(ti.freq) : ''}</span></div></div>`; }).join('')}</div>
      <button class="btn" type="button" data-a="start-fisio">Fai ora il blocco fisio</button></section>` : '';

  const [qa, qb, qsrc, qorig] = quoteOf(today);
  return `<header class="top">
      <h1 class="quote">${esc(qa)} <span>${esc(qb)}</span></h1>
      <p class="motto">${qorig ? `<i>${esc(qorig)}</i>` : ''}<span class="src">${esc(qsrc)}</span></p></header>
    ${actHtml}
    <section class="stack"><div class="week">${weekHtml}</div>
      <div class="card"><div class="balance">
        <span>Tirata</span><div class="meter"><i style="width:${pull / maxV * 100}%"></i></div><span>${pull} serie</span>
        <span>Spinta</span><div class="meter push"><i style="width:${push / maxV * 100}%"></i></div><span>${push} serie</span>
      </div><p class="small muted">Serie della settimana. Obiettivo: tirata ≥ spinta.</p></div>
      ${alerts.map(([k, a, b]) => `<div class="alert ${k}"><div>${esc(a)} <span>${esc(b)}</span></div></div>`).join('')}
    </section>
    <section class="stack"><div class="sec-head"><h2>Inizia una scheda</h2></div>${tplHtml}
      <button class="btn primary big" type="button" data-a="go" data-v="genera">Crea una seduta al volo</button></section>
    ${phHtml}`;
}

      <div class="row">${S.sample ? `<button class="btn primary" type="button" data-a="gen-claude" ${g.busy ? 'disabled' : ''}>Genera con Claude</button>` : ''}
        <button class="btn${S.sample ? '' : ' primary'}" type="button" data-a="gen-rules" ${g.busy ? 'disabled' : ''}>Genera con le regole</button></div>
      <p class="small muted">${S.sample ? (window.BT_SETUP ? 'Claude gira su GitHub con il tuo abbonamento, nessuna API a pagamento: ci mette 1-2 minuti. Le regole sono istantanee e funzionano sempre.' : 'Claude usa il tuo account claude.ai, nessuna API a pagamento. Le regole sono istantanee e funzionano sempre.') : 'Claude non è disponibile in questa vista: usa le regole.'}</p>

function itemCode(items, i) {
  const it = items[i];
  if (it.code) return it.code;
  if (it.warmup) { let k = 0; for (let j = 0; j <= i; j++) if (items[j].warmup) k++; return `R${k}`; }

}

}
async function startSession(meta, items) {

      sets: it.sets, min: it.min, max: it.max, rest: it.rest, load: 'corpo', equip: [], cue: it.note || '', notes: [], progression: '', origin: meta.source};
    try { await S.db.doc('exercises/' + id).set(e); it.ex = id; S.ex[id] = Object.assign({id}, e); } catch (err) { it.ex = null; }

  const now = Date.now();

    items: items.map(i => Object.assign(clone(i), {log: []})), updatedAt: now,
    tplId: meta.tplId || null, head: meta.head || null, blocks: meta.blocks || null, paletti: meta.paletti || null, minutes: meta.minutes || null};

}
const tplMeta = t => ({title: `${t.code} · ${t.name}`, code: t.code, source: 'scheda', tplId: t.id, head: t.head || null, blocks: t.blocks || null,
  paletti: t.paletti && t.paletti.length ? t.paletti : String(t.rules || '').split('\n').map(x => x.trim()).filter(Boolean), minutes: t.minutes});

  const a = S.active, it = a.items[i], d = draftFor(i);
  audioUnlock();
  it.log.push({reps: d.reps, load: d.load || '', rir: d.rir, at: Date.now()});

  const next = a.items[i + 1];

  haptic(closed ? 'group' : 'set');

/* ---------- movimento: molle, gesti, vibrazione ---------- */
const reduced = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
function haptic(kind) {
  const p = {set: 12, group: [18, 70, 40], timer: [150, 90, 150], finish: [30, 60, 30, 60, 80]}[kind];
  try { navigator.vibrate && navigator.vibrate(p); } catch (e) {}

// molla con i due parametri di Apple: smorzamento (1 = nessun rimbalzo) e risposta in secondi
function spring(from, to, {damping = 1, response = .35, velocity = 0} = {}, onUpdate, onDone) {
  const w = 2 * Math.PI / response, k = w * w, c = 2 * damping * w;
  let x = from, v = velocity, last = performance.now(), raf = 0, live = true;
  const step = now => {
    const dt = Math.min(.032, (now - last) / 1000); last = now;
    for (let n = 0; n < 4; n++) { const h = dt / 4; v += (-k * (x - to) - c * v) * h; x += v * h; }
    if (Math.abs(x - to) < .4 && Math.abs(v) < 8) { live = false; onUpdate(to); onDone && onDone(); return; }
    onUpdate(x); raf = requestAnimationFrame(step);
  };

}
const project = (v, d = .998) => (v / 1000) * d / (1 - d);

const SH = {x: 0, y: 0, ay: null, ax: null, g: null, noClick: 0};
function sheetEl() { return $('#sheet'); }
function setSheet() {
  const el = sheetEl(), H = el.offsetHeight || 1;
  el.style.transform = SH.x || SH.y ? `translate3d(${SH.x.toFixed(1)}px,${SH.y.toFixed(1)}px,0)` : '';
  $('#overlay').style.setProperty('--dim', String(Math.max(0, Math.min(1, 1 - SH.y / H))));
}
function stopSheet() { SH.ay && SH.ay.stop(); SH.ax && SH.ax.stop(); SH.ay = SH.ax = null; }
function sheetIn() {
  stopSheet(); SH.x = 0;
  if (reduced()) { SH.y = 0; setSheet(); return; }
  SH.y = sheetEl().offsetHeight || 400; setSheet();
  SH.ay = spring(SH.y, 0, {damping: 1, response: .35}, y => { SH.y = y; setSheet(); });
}
function dismissSheet(v = 0) {
  if ($('#overlay').hidden) return;
  stopSheet();
  if (reduced()) return closeSheet();
  const H = sheetEl().offsetHeight || 400;
  SH.ay = spring(SH.y, H + 24, {damping: 1, response: .3, velocity: v}, y => { SH.y = y; setSheet(); }, () => closeSheet());
}
function resetSheet() { stopSheet(); SH.x = SH.y = 0; const el = sheetEl(); el.style.transform = ''; $('#overlay').style.setProperty('--dim', '1'); }
// cambio esercizio: esce dal lato verso cui va il dito, il nuovo entra dal lato opposto
function changeEx(dir, v = 0) {
  const m = workoutModel(); if (!m || !S.sheet) return;
  const k = S.sheet.i + dir; if (k < 0 || k >= m.items.length) return;
  stopSheet();
  const W = sheetEl().offsetWidth || 360;
  const swap = () => { S.sheet.i = k; drawSheet(); sheetEl().scrollTop = 0; SH.x = dir * W * .6;
    SH.ax = spring(SH.x, 0, {damping: 1, response: .3}, x => { SH.x = x; setSheet(); }); };
  if (reduced()) { SH.x = 0; S.sheet.i = k; drawSheet(); setSheet(); return; }
  SH.ax = spring(SH.x, -dir * W, {damping: 1, response: .22, velocity: v}, x => { SH.x = x; setSheet(); }, swap);
}
function velocityOf(hist) {
  const last = hist[hist.length - 1]; let first = hist[0];
  for (const h of hist) if (last.t - h.t <= 100) { first = h; break; }
  const dt = (last.t - first.t) / 1000;
  return dt > 0 ? {vx: (last.x - first.x) / dt, vy: (last.y - first.y) / dt} : {vx: 0, vy: 0};
}
function bindSheetGestures() {
  const el = sheetEl();
  el.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (e.target.closest('input, textarea, select')) return;
    stopSheet();   // si può riprendere al volo un foglio in movimento
    SH.g = {id: e.pointerId, x0: e.clientX, y0: e.clientY, sx: SH.x, sy: SH.y, dir: null, drag: !!e.target.closest('.sh-drag'), hist: [{t: e.timeStamp, x: e.clientX, y: e.clientY}]};
  });
  el.addEventListener('pointermove', e => {
    const g = SH.g; if (!g || e.pointerId !== g.id) return;
    g.hist.push({t: e.timeStamp, x: e.clientX, y: e.clientY}); if (g.hist.length > 8) g.hist.shift();
    let dx = e.clientX - g.x0, dy = e.clientY - g.y0;
    if (!g.dir) {
      if (Math.hypot(dx, dy) < 10) return;
      if (Math.abs(dx) > Math.abs(dy) * 1.2 && S.sheet) g.dir = 'x';
      else if (g.drag) g.dir = 'y';
      else { SH.g = null; return; }
      try { el.setPointerCapture(g.id); } catch (err) {}
      g.x0 = e.clientX; g.y0 = e.clientY; dx = dy = 0;
    }
    const m = workoutModel();
    if (g.dir === 'y') { let y = g.sy + dy; if (y < 0) y = rubberband(y, el.offsetHeight); SH.y = y; }
    else {
      let x = g.sx + dx;
      const atEnd = !m || (x < 0 && S.sheet.i >= m.items.length - 1) || (x > 0 && S.sheet.i <= 0);
      SH.x = atEnd ? rubberband(x, el.offsetWidth) : x;
    }
    setSheet();
  });
  const end = e => {
    const g = SH.g; if (!g || e.pointerId !== g.id) return;
    SH.g = null;

    const {vx, vy} = velocityOf(g.hist);
    if (g.dir === 'y') {

    } else {

      else if (m && proj > W / 3 && S.sheet.i > 0) changeEx(-1, vx);
      else SH.ax = spring(SH.x, 0, {damping: .85, response: .3, velocity: vx}, x => { SH.x = x; setSheet(); });
    }

  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

  const total = m.items.reduce((n, x) => n + x.sets, 0), done = m.items.reduce((n, x) => n + Math.min(x.log.length, x.sets), 0);

function spark(hist) {
  const pts = hist.slice(0, 12).reverse().map(h => Math.max(...h.log.map(s => s.reps)));
  if (pts.length < 2) return '';
  const W = 300, H = 64, P = 14, max = Math.max(...pts), min = Math.min(...pts), span = max - min || 1;
  const xy = pts.map((v, i) => [P + i * (W - 2 * P) / (pts.length - 1), H - 12 - (v - min) / span * (H - 26)]);
  const line = xy.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ');
  const last = xy[xy.length - 1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Ripetizioni migliori per seduta, da ${pts[0]} a ${pts[pts.length - 1]}">
    <line class="gr" x1="${P}" x2="${W - P}" y1="${H - 12}" y2="${H - 12}"/>
    <polygon class="ar" points="${xy[0][0].toFixed(1)},${H - 12} ${line} ${last[0].toFixed(1)},${H - 12}"/>
    <polyline class="ln" points="${line}"/><circle class="dt" cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.5"/>
    <text x="${P}" y="10">${max} max</text><text x="${W - P}" y="10" text-anchor="end">ultima ${pts[pts.length - 1]}</text></svg>`;
}

}
/* bilancio: ogni esercizio confrontato con l'ultima volta prima di questa seduta */
function loadRank(l) { if (!l) return 0; if (/kg$/.test(l)) return 100 + parseFloat(l); const k = bands().indexOf(l); return k >= 0 ? k + 1 : .5; }
function perfBefore(exId, t) {
  for (const s of S.sessions) { if ((s.startedAt || 0) >= t) continue; const it = (s.items || []).find(i => i.ex === exId && !i.warmup && (i.log || []).length); if (it) return it.log; }
  return null;
}
function compareLast(it, t) {
  const cur = it.log || [], prev = perfBefore(it.ex, t);
  if (!cur.length) return {k: 'eq', t: 'non fatto'};
  if (!prev) return {k: 'new', t: 'prima volta'};
  const top = log => log.reduce((b, x) => loadRank(x.load) > loadRank(b) ? x.load || '' : b, log[0].load || '');
  const lc = loadRank(top(cur)), lp = loadRank(top(prev)), u = unitMark(it.unit);
  if (lc > lp) return {k: 'up', t: `${fmtLoad(top(prev))} → ${fmtLoad(top(cur))}`};
  if (lc < lp) return {k: 'down', t: `più leggero: ${fmtLoad(top(cur))}`};
  const rc = cur.reduce((n, x) => n + x.reps, 0), rp = prev.reduce((n, x) => n + x.reps, 0);
  return rc > rp ? {k: 'up', t: `+${rc - rp}${u} in totale`} : rc < rp ? {k: 'down', t: `${rc - rp}${u} in totale`} : {k: 'eq', t: 'stabile'};
}
function viewSeduta() {
  const s = S.sessions.find(x => x.id === S.param);
  if (!s) return `<div class="empty"><b>Seduta non trovata.</b></div><button class="btn" type="button" data-a="go" data-v="storico">← Storico</button>`;
  const items = s.items || [], work = items.filter(i => !i.warmup);
  const sets = work.reduce((n, i) => n + (i.log || []).length, 0);
  const mins = s.endedAt ? Math.round((s.endedAt - s.startedAt) / 60000) : null;
  const cmp = items.map(it => it.warmup ? null : compareLast(it, s.startedAt || 0));
  const ups = cmp.filter(c => c && c.k === 'up').length;
  const fresh = S.justFinished === s.id;
  return `<header class="top"><button class="btn sm ghost" type="button" data-a="go" data-v="storico" style="align-self:flex-start">← Storico</button>
      <div class="eyebrow">${fresh ? 'Seduta conclusa · ' : ''}${fmtDay(s.date)} · ${hhmm(s.startedAt)}${s.endedAt ? '–' + hhmm(s.endedAt) : ''}</div>
      <h1>${esc(s.title)}</h1>
      ${ups ? `<p class="muted">${ups === 1 ? 'Un esercizio è andato meglio' : `${ups} esercizi sono andati meglio`} dell'ultima volta.</p>` : ''}</header>
    <div class="tiles"><div class="tile"><span class="l">Durata</span><span class="v">${mins != null ? mins + '′' : '—'}</span></div>
      <div class="tile"><span class="l">Serie</span><span class="v">${sets}</span></div>
      <div class="tile"><span class="l">Tirata / spinta</span><span class="v">${setsIn(s, ['tirata'])}<span class="muted">/</span>${setsIn(s, ['spinta'])}</span></div>
      <div class="tile"><span class="l">Progressi</span><span class="v">${ups}</span></div></div>
    <section class="stack"><div class="sec-head"><h2>Rispetto all'ultima volta</h2></div>
    <div class="list">${items.map((it, i) => `<div class="lrow" style="cursor:default"><span class="icode mono">${esc(itemCode(items, i))}</span><span class="main"><span class="name">${esc(it.name)}</span>
      <span class="sub">${(it.log || []).length ? esc(fmtLog(it.log, it.unit)) : 'non fatto'}</span>${it.userNote ? `<span class="unote">“${esc(it.userNote)}”</span>` : ''}</span>
      ${cmp[i] ? `<span class="delta ${cmp[i].k}">${cmp[i].k === 'up' ? '▲ ' : cmp[i].k === 'down' ? '▼ ' : ''}${esc(cmp[i].t)}</span>` : ''}</div>`).join('')}</div></section>
    ${s.note ? `<div class="card"><span class="eyebrow">Note per Claude</span><p style="white-space:pre-wrap">${esc(s.note)}</p></div>` : ''}
    <div class="row"><button class="btn" type="button" data-a="repeat" data-id="${esc(s.id)}">Ripeti questa seduta</button><span class="spacer"></span><button class="btn danger" type="button" data-a="sess-del">Elimina</button></div>
    ${S.confirm === 'sess-del' ? `<div class="confirm"><b>Eliminare questa seduta?</b><span class="small">Le serie registrate spariscono anche dallo storico degli esercizi.</span><div class="row"><button class="btn danger" type="button" data-a="sess-del-yes" data-id="${esc(s.id)}">Elimina</button><button class="btn ghost" type="button" data-a="confirm-no">Annulla</button></div></div>` : ''}`;
}

async function writeDoc(path, data, okMsg) {

  catch (e) { toast(e && e.code === 'quota_exceeded' ? 'Spazio del database esaurito: elimina qualche seduta vecchia.' : 'Non sono riuscito a salvare. Controlla la connessione e riprova.'); return false; }
}
const strip = o => { const c = clone(o); delete c.id; delete c.isNew; return c; };
function saveSettings(patch, msg) { const next = Object.assign(strip(S.settings), patch); S.settings = Object.assign({id: 'main'}, next); draw(); return writeDoc('settings/main', next, msg); }

document.addEventListener('click', async ev => {
  const tab = ev.target.closest('[data-tab]');
  if (tab) { go(tab.dataset.tab); return; }
  if (performance.now() < SH.noClick && ev.target.closest('#sheet')) { ev.preventDefault(); return; }
  if (ev.target === $('#overlay')) { dismissSheet(); return; }
  const b = ev.target.closest('[data-a]');
  if (!b) return;
  const a = b.dataset.a, i = b.dataset.i != null ? Number(b.dataset.i) : null, v = b.dataset.v, id = b.dataset.id;

    case 'resume': go('sessione'); break;
    case 'open-tpl': S.tplDraft = null; S.back = S.view === 'oggi' ? 'oggi' : 'schede'; if (S.active && S.active.tplId === id) go('sessione'); else go('scheda', id); break;
    case 'tpl-start': { const t = S.tpl[id]; if (t) startSession(tplMeta(t), (t.items || []).map(fromTplItem)); break; }
    case 'pdot': { const t = S.tpl[S.param]; if (!t) break; if (await startSession(tplMeta(t), (t.items || []).map(fromTplItem))) logSet(i); break; }
    case 'dot': { const it = act.items[i], j = Number(b.dataset.j);
      if (j < it.log.length) { const removed = it.log.splice(j, 1)[0]; touch(); patchRow(i); toast(`Serie ${j + 1} tolta`, () => { if (S.active === act) { it.log.splice(j, 0, removed); touch(); patchRow(i, j); } }); }
      else logSet(i);
      break; }
    case 'sheet': openSheet(i); break;
    case 'sheet-log': logSet(i); break;
    case 'sh-close': dismissSheet(); break;
    case 'sh-nav': changeEx(Number(b.dataset.d)); break;
    case 'reset': S.confirm = 'reset'; draw(); window.scrollTo(0, 0); break;
    case 'reset-yes': act.items.forEach(it => { it.log = []; }); S.draft = {}; S.confirm = null; S.timer = null; touch(); draw(); toast('Serie azzerate'); break;
    case 'add-fisio': act.items.push(...phaseItems().map(it => Object.assign(it, {block: 'Tendine'}))); touch(); draw(); break;
    case 'start-fisio': { const ph = curPhase(); if (ph) startSession({title: `Fisio · fase ${phaseNum()}`, code: 'F', source: 'fisio', head: ['Fisio', `fase ${phaseNum()}`], paletti: (curPhase().rules || [])}, phaseItems()); break; }
    case 'repeat': { const s = S.sessions.find(x => x.id === id); if (s) startSession({title: s.title, code: s.code, source: s.source, tplId: s.tplId, head: s.head, blocks: s.blocks, paletti: s.paletti, minutes: s.minutes}, (s.items || []).map(it => Object.assign(clone(it), {log: []}))); break; }

    case 'gen-min': S.gen.minutes = Number(v); saveGenPrefs(); draw(); break;
    case 'gen-focus': S.gen.focus = v; saveGenPrefs(); draw(); break;
    case 'gen-eq': { const q = S.gen.equip; S.gen.equip = q.includes(v) ? q.filter(x => x !== v) : [...q, v]; saveGenPrefs(); draw(); break; }
    case 'gen-rules': S.gen.text = ($('#gen-text') || {}).value || ''; S.gen.err = ''; S.gen.result = genRules(S.gen); saveGenPrefs(); draw(); break;
    case 'gen-claude': if (S.sample && !S.gen.busy) genClaude(); break;
    case 'gen-stop': S.gen.ctl && S.gen.ctl.abort(); break;
    case 'gen-start': { const r = S.gen.result; if (r) { S.gen.result = null; startSession({title: r.title, code: '', source: r.source, minutes: S.gen.minutes, paletti: r.why ? [r.why] : null}, r.items); } break; }
    case 'gen-save': { const r = S.gen.result; if (!r) break;
      S.tplDraft = {id: 'T' + uid(), isNew: true, code: 'G', name: r.title, minutes: S.gen.minutes, rules: r.why || '', order: 50,
        items: r.items.map(it => ({ex: it.ex, name: it.name, cat: it.cat, unit: it.unit, perSide: it.perSide, kind: it.kind, sets: it.sets, min: it.min, max: it.max, rest: it.rest, pair: it.pair, warmup: it.warmup, note: it.note}))};
      go('scheda', S.tplDraft.id); break; }

    case 'd-reps': { const d = draftFor(i), it = act.items[i]; d.reps = Math.max(0, d.reps + Number(b.dataset.d) * (it.unit === 'sec' ? 5 : 1)); draw(); break; }
    case 'd-load': draftFor(i).load = v; draw(); break;
    case 'd-kg': { const d = draftFor(i), cur = /kg$/.test(d.load) ? parseFloat(d.load) : 0; const nx = Math.max(0, cur + Number(b.dataset.d)); d.load = nx > 0 ? `${nx} kg` : ''; draw(); break; }
    case 'd-rir': { const d = draftFor(i); d.rir = d.rir === Number(v) ? null : Number(v); draw(); break; }
    case 'del-set': { const it = act.items[i], j = Number(b.dataset.j), removed = it.log.splice(j, 1)[0]; touch(); patchRow(i);
      toast(`Serie ${j + 1} eliminata`, () => { if (S.active === act) { it.log.splice(j, 0, removed); touch(); patchRow(i, j); } }); break; }
    case 'add-item': openPicker(exId => { const e = S.ex[exId]; act.items.push(fromEx(e)); touch(); draw(); }); break;
    case 'finish': S.confirm = 'finish'; draw(); window.scrollTo(0, 0); break;
    case 'confirm-no': S.confirm = null; draw(); break;
    case 'finish-yes': { act.status = 'finita'; act.endedAt = Date.now(); touch(); await flush(); const sid = act.id; haptic('finish'); S.justFinished = sid;
      S.active = null; S.timer = null; lsSet('rc-active', null); toast('Seduta salvata'); go('seduta', sid); break; }
    case 'discard': { const sid = act.id; clearTimeout(saveT); S.dirty = false; S.active = null; S.timer = null; lsSet('rc-active', null);
      try { await saving; await S.db.doc('sessions/' + sid).delete(); } catch (e) {} toast('Seduta eliminata'); go('oggi'); break; }
    case 't-start': audioUnlock(); startTimer(Number(b.dataset.d)); break;
    case 't-add': if (S.timer) { S.timer.end += Number(b.dataset.d) * 1000; S.timer.sec = Math.max(0, S.timer.sec + Number(b.dataset.d)); tick(); drawTimer(); } break;
    case 't-stop': S.timer = null; clearInterval(tInt); drawTimer(); break;

    case 'tpl-new': S.tplDraft = {id: 'T' + uid(), isNew: true, code: '', name: '', minutes: 30, rules: '', order: 50, items: []}; go('scheda', S.tplDraft.id); break;
    case 'tpl-edit': { const t = S.tpl[id]; S.tplDraft = clone(t); draw(); break; }
    case 'tpl-dup': { const t = S.tpl[id]; S.tplDraft = Object.assign(clone(t), {id: 'T' + uid(), isNew: true, code: t.code + "'", name: t.name + ' (copia)'}); S.param = S.tplDraft.id; draw(); break; }
    case 'tpl-cancel': { const wasNew = S.tplDraft && S.tplDraft.isNew; S.tplDraft = null; if (wasNew) go('schede'); else draw(); break; }
    case 'ti-up': case 'ti-down': { const it = S.tplDraft.items, j = a === 'ti-up' ? i - 1 : i + 1; if (j >= 0 && j < it.length) { [it[i], it[j]] = [it[j], it[i]]; draw(); } break; }
    case 'ti-rm': S.tplDraft.items.splice(i, 1); draw(); break;
    case 'ti-add': openPicker(exId => { const e = S.ex[exId]; S.tplDraft.items.push({ex: e.id, sets: e.sets, min: e.min, max: e.max, rest: e.rest}); draw(); }); break;
    case 'tpl-save': { const d = S.tplDraft; if (!d.name.trim() || !d.code.trim()) { toast('Dai alla scheda una sigla e un nome'); break; }
      const ok = await writeDoc('templates/' + d.id, strip(d), 'Scheda salvata'); if (ok) { S.tpl[d.id] = Object.assign({id: d.id}, strip(d)); S.tplDraft = null; go('scheda', d.id); } break; }
    case 'tpl-del': S.confirm = 'tpl-del'; draw(); break;
    case 'tpl-del-yes': try { await S.db.doc('templates/' + id).delete(); delete S.tpl[id]; toast('Scheda eliminata'); go('schede'); } catch (e) { toast('Non sono riuscito a eliminarla'); } break;

    case 'exf-cat': S.exFilter.cat = v; draw(); break;
    case 'exf-st': S.exFilter.status = v; draw(); break;
    case 'ex-open': go('esercizio', id); break;
    case 'ex-new': go('esercizio', '__new'); break;
    case 'ex-edit': S.exEdit = true; draw(); break;
    case 'ex-cancel': S.exEdit = false; draw(); break;
    case 'ex-info': if (id && S.ex[id]) showExInfo(id); break;

    case 'pick-close': dismissSheet(); break;
    case 'pick-cat': S.picker.cat = v; drawPicker(); break;
    case 'pick': { const cb = S.picker && S.picker.cb; closeSheet(); cb && cb(id); break; }

    case 'open-sess': go('seduta', id); break;
    case 'sess-del': S.confirm = 'sess-del'; draw(); break;
    case 'sess-del-yes': try { await S.db.doc('sessions/' + id).delete(); toast('Seduta eliminata'); go('storico'); } catch (e) { toast('Non sono riuscito a eliminarla'); } break;

    case 'set-phase': saveSettings({phase: Number(v), phaseSince: Number(v) !== phaseNum() ? isoDay() : (S.settings.phaseSince || isoDay())}, `Fase ${v} impostata`); break;
    case 'save-profile': saveSettings({profile: $('#p-profile').value}, 'Contesto salvato'); break;
    case 'save-bands': { const list = $('#p-bands').value.split(',').map(x => x.trim()).filter(Boolean); if (list.length) saveSettings({bands: list}, 'Bande salvate'); break; }
    case 'export': exportAll(); break;
  }
});

  if (t.id === 'p-since') saveSettings({phaseSince: t.value}, 'Data salvata');

    const it = S.tplDraft.items[Number(t.dataset.ti)], k = t.dataset.k;
    if (k === 'warmup') it.warmup = t.checked; else if (k === 'block') it.block = t.value.trim() || null; else if (k === 'pair') it.pair = t.value.trim().toUpperCase() || null; else it[k] = t.value === '' ? undefined : Number(t.value);
  }
});
document.addEventListener('submit', async ev => {
  if (ev.target.id !== 'ex-form') return;
  ev.preventDefault();
  const f = new FormData(ev.target), num = k => Math.max(0, Math.round(Number(f.get(k)) || 0));
  const data = {name: String(f.get('name')).trim(), cat: f.get('cat'), status: f.get('status'), foot: f.get('foot'), kind: f.get('kind'), load: f.get('load'), unit: f.get('unit'),
    sets: Math.max(1, num('sets')), min: num('min'), max: Math.max(num('min'), num('max')), rest: num('rest'), perSide: f.get('perSide') === 'on', equip: f.getAll('equip'),
    cue: String(f.get('cue') || '').trim(), progression: String(f.get('progression') || '').trim(),
    notes: String(f.get('notes') || '').split('\n').map(l => l.trim()).filter(Boolean).map(l => { const k = l.indexOf(':'); return k > 0 ? [l.slice(0, k).trim(), l.slice(k + 1).trim()] : ['Nota', l]; })};
  if (!data.name) { toast('Il nome è obbligatorio'); return; }
  const isNew = S.param === '__new';
  const id = isNew ? slug(data.name) + '-' + uid() : S.param;
  const prev = isNew ? {} : strip(S.ex[id]);
  const ok = await writeDoc('exercises/' + id, Object.assign(prev, data), 'Esercizio salvato');
  if (ok) { S.ex[id] = Object.assign({id}, prev, data); S.exEdit = false; go('esercizio', id); }
});

});

async function exportAll() {
  const data = {exportedAt: new Date().toISOString(), settings: strip(S.settings), exercises: S.ex, templates: S.tpl, phases: S.phases, sessions: S.sessions};
  try { await S.downloads.save({filename: `body-temple-backup-${isoDay()}.json`, data: JSON.stringify(data, null, 2)}); toast('Backup scaricato'); }
  catch (e) { if (!e || e.code !== 'declined') toast('Download non disponibile qui'); }
}

/* ---------- avvio e sincronizzazione ---------- */
function onSessions(snap) {
  S.sessions = snap.docs.map(d => Object.assign({id: d.id}, d.data())).sort((a, b) => (b.startedAt || 0) - (a.startedAt || 0));
  const loc = S.localActive;
  if (loc) {
    // copia locale di una seduta rimasta in sospeso: vale solo se è più recente di quella nel database
    S.localActive = null;
    const r = S.sessions.find(s => s.id === loc.id);
    const hasSets = loc.items.some(i => i.log.length);
    if ((r && r.status === 'attiva' && (r.updatedAt || 0) < (loc.updatedAt || 0)) || (!r && hasSets)) {
      S.active = loc; S.dirty = true; setTimeout(flush, 500);
    } else lsSet('rc-active', null);
  }
  const remote = S.sessions.find(s => s.status === 'attiva');
  if (!S.active && remote) { S.active = clone(remote); S.draft = {}; }
  else if (S.active && !S.dirty) {
    const same = S.sessions.find(s => s.id === S.active.id);
    if (same && (same.updatedAt || 0) > (S.active.updatedAt || 0)) {
      if (same.status === 'finita') { S.active = null; S.timer = null; lsSet('rc-active', null); if (S.view === 'sessione') S.view = 'oggi'; }
      else { S.active = clone(same); S.draft = {}; }
    } else if (!same && snap.metadata && !snap.metadata.fromCache && (Date.now() - S.active.startedAt) > 60000 && !S.dirty) {
      S.active = null; S.timer = null; lsSet('rc-active', null); if (S.view === 'sessione') S.view = 'oggi';
    }
  }
  S.loaded.ses = 1; ready();
}
function ready() { if (S.status === 'loading' && S.loaded.ex && S.loaded.tpl && S.loaded.set && S.loaded.ses && S.loaded.ph) S.status = 'ok'; render(); }
function subErr(e) { if (S.status === 'loading') { S.status = 'nodb'; S.err = e && e.code; } toast('Sincronizzazione interrotta: ricarica la pagina'); render(); }

async function boot() {
  draw();
  if (!window.claude || !window.claude.use) { S.status = 'nodb'; draw(); return; }
  const local = lsGet('rc-active', null);
  claude.use('sample').then(s => { S.sample = s; if (S.status === 'ok') render(); });
  claude.use('downloads').then(d => { S.downloads = d; if (S.status === 'ok') render(); });
  const db = await claude.use('db');
  if (!db) { S.status = 'nodb'; draw(); return; }
  S.db = db;
  if (local && local.status === 'attiva' && Array.isArray(local.items)) S.localActive = local;
  const toMap = snap => { const m = {}; snap.docs.forEach(d => { m[d.id] = Object.assign({id: d.id}, d.data()); }); return m; };
  db.collection('exercises').onSnapshot(s => { S.ex = toMap(s); S.loaded.ex = 1; ready(); }, subErr);
  db.collection('templates').onSnapshot(s => { S.tpl = toMap(s); S.loaded.tpl = 1; ready(); }, subErr);
  db.collection('phases').onSnapshot(s => { S.phases = toMap(s); S.loaded.ph = 1; ready(); }, subErr);
  db.doc('settings/main').onSnapshot(d => { S.settings = d.exists ? Object.assign({id: 'main'}, d.data()) : {}; S.loaded.set = 1; ready(); }, subErr);
  db.collection('sessions').orderBy('startedAt', 'desc').limit(500).onSnapshot(onSessions, subErr);
}
document.addEventListener('touchstart', () => {}, {passive: true});
bindSheetGestures();
boot();
